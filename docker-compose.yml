# A.6 坑表對策落點:shm_size(坑1)、釘版+digest(坑3,DECISIONS.md #3)。
# maintenance_work_mem(坑2)與 plan_cache_mode(坑7)為 session 級,由 internal/db 處理。
services:
  db:
    image: pgvector/pgvector:0.8.1-pg16@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
    shm_size: 2gb
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
