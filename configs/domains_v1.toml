# B.1 域 ↔ 檔位映射表(DECISIONS #15,(iii) 混合制)。
# corpusgen(Python)與 internal/filters(Go,順序 4)共用此檔——單一事實來源。
# proportions 由 corpusgen 正規化(總和 ≈ 1,浮點誤差可容)。
# 初始案,5k 實跑 GLS 後可調,調整記入 DECISIONS。

[tiers]
p07 = ["studio photography"]
p3 = ["esports & board games"]
p6 = ["dance rehearsals", "festival parades"]
p15 = ["weddings", "graduation ceremonies", "street markets", "coffee & desserts", "museum exhibitions"]
p50 = [
  "sports events", "music performances", "hiking & mountaineering",
  "beach activities", "cooking & cuisine", "animals & pets", "wildlife",
  "city streetscapes", "architecture & landmarks", "transportation",
  "gardening & plants", "work scenes", "medical scenes",
  "classrooms & courses", "children's play",
]
# 背景域:不屬任何檔位,確保檔位不構成全語料窮盡分割。
# religious ceremonies 刻意置此(B.1 注記:檢查 5 預警名單,重生不傷檔位)。
background = [
  "religious ceremonies", "agriculture & fishing",
  "construction & manufacturing", "tech expos",
  "camping & picnics", "volunteering & charity",
]

# Per-domain 追加約束(corpusgen 附加於 user prompt;PROMPTS.md 自動揭露)。
# 歷史:勸誡式 hint 版("vary species widely")8.98%→34.73% 失敗,git 史留檔;
# 現行機制為 [domain_rosters] per-record 指派(DECISIONS #19)。
[domain_hints]

# 靜態物種名冊(DECISIONS #19):批內逐筆輪替指派,模型對「寫什麼物種」
